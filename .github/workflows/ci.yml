name: CI

on:
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  # para bajar org.printscript:runner de GitHub Packages
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # no hay gradle.properties asiq build.gradle.kts cae a estas variables
      - name: Run checks
        run: ./gradlew check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
