name: CD

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

env:
  # ghcr exige el nombre en minusculas
  IMAGE: ghcr.io/ingsis-printscript-grupo3/printscript-service

permissions:
  contents: read
  # para bajar org.printscript:runner y para subir la imagen
  packages: write

jobs:
  publish:
    # a mano solo tiene sentido en las ramas que publican
    if: github.ref_name == 'dev' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # un tag con el nombre de la rama, que se pisa, y otro con el commit, que queda fijo
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          # la provenance guardaria los build-args, token incluido, junto a la imagen
          provenance: false

  deploy:
    needs: publish
    # el stack hoy solo existe en la VM de dev
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Preparar la clave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # con el sha y no con el tag de la rama: despliega exactamente este commit. Y toca un
      # solo servicio del stack, en vez de volver a mandar el archivo entero
      - name: Actualizar este servicio en el Swarm
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            ${{ secrets.VM_USER }}@${{ secrets.VM_DEV_HOST }} \
            "docker service update --image ${{ env.IMAGE }}:${{ github.sha }} snippet-searcher_printscript-service"
